bibliography: references.bib
csl: harvard-cite-them-right-no-et-al.csl

jupyter: python3

execute:
  echo: false
  warning: false
  message: false
  python: .venv/bin/python3

toclinkcolor: black

format:
  pdf:
    citeproc: false
    filters: 
      - at: pre-quarto
        path: _extensions/andrewheiss/wordcount/citeproc.lua
      - at: pre-quarto
        path: _extensions/andrewheiss/wordcount/wordcount.lua
    documentclass: MastersDoctoralThesis
    classoption: ["12pt", "oneside", "english", "onehalfspacing", "headsepline"]
    mainfont: "Times New Roman"
    fontsize: 12pt
    linestretch: 1.5
    geometry:
      - paper=a4paper
      - inner=2.5cm
      - outer=3.8cm
      - top=2cm
      - bottom=2cm
    template-partials:
      - title.tex
      - before-body.tex
    include-before-body:
      - definitions.tex
    include-in-header:
      - preamble.tex
    code-overflow: wrap
    keep-tex: true
    toc: false
    toc-depth: 2
    number-sections: true
    crossref:
      chapters: true
    top-level-division: chapter
    colorlinks: true
    urlcolor: blue
    linkcolor: black
    citecolor: black

wordcount-pdf: default
wordcount: "Word count: {{< words-body >}}"
