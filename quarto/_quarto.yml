project:
  type: book
  output-dir: .

book:
  title: "Measuring Technical Debt in Mission Critical Trading Systems"
  subtitle: "A Service Level Quantitative Framework"
  date: "2 August 2026"
  author:
    name: Tobias Zeier
  abstract: "Technical debt in mission-critical trading IT accumulates largely outside source code. It builds up in infrastructure lifecycle exposure, patch delay and operational instability, where the dominant code-centric measurement tools cannot observe it. This thesis develops and evaluates a quantitative framework for prioritising technical debt at the service level using operational data alone. Following a Design Science approach, five indicators (incident frequency, mean time to recover, change failure rate, patch recency and unsupported component months) were extracted from two years of live ITSM and CMDB records at a regulated Swiss financial trading institution. They were combined in a TOPSIS model that ranks six production services by debt priority under two weight configurations and across two observation years. The evaluation tests the ranking on four fronts: its stability under weight and temporal variation, its convergence with SAW and VIKOR, its divergence from an incident-only baseline, and its structural rigour under service removal. The last is addressed through a rank-reversal-free absolute-mode TOPSIS variant. Scored with that variant across 20,000 sampled weightings, the lowest-priority service is near-invariant to the weighting, while the single highest priority is weight-dependent within a stable three-service cluster. The multi-criteria design also surfaces infrastructure lifecycle debt that an incident count misses. Method disagreement, in turn, localises to that high-priority cluster, exposing a substantive choice about whether debt dimensions are compensatory. To the best of current knowledge, this is the first application of TOPSIS to live service management records for technical debt prioritisation in financial trading IT, and it contributes an auditable evaluation logic suited to regulated environments. The rankings are ordinal decision-support signals rather than measurements of debt. External and longitudinal validation are identified as the principal directions for future work."
  keyword: "technical debt, technical debt prioritisation, TOPSIS, multi-criteria decision-making, MCDM, trading IT, ITSM, CMDB, DORA metrics, composite score"
  chapters:
    - index.qmd
    - references.qmd
  
  appendices: 
    - appendices/appendixa.qmd
    - appendices/appendixb.qmd
    - appendices/appendixc.qmd

