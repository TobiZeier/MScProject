project:
  type: book
  output-dir: .

book:
  title: "Measuring Technical Debt in Mission-Critical Trading Systems"
  subtitle: "A Service-Level Quantitative Framework"
  date: "10 August 2026"
  author:
    name: Tobias Zeier
  abstract: "Technical debt in mission critical trading IT accumulates outside source code, in infrastructure lifecycle exposure, patch delay and operational instability that source code tools cannot observe. This thesis develops and evaluates a quantitative framework for prioritising debt at the service level from operational data alone. Following a Design Science approach, five indicators (incident frequency, mean time to recover, change failure rate, patch recency and unsupported component months) were extracted from two years of ITSM and CMDB records at a regulated Swiss financial institution. A TOPSIS model ranks six demonstration services by debt priority under two weight configurations and across two years. The evaluation tests the ranking on five fronts. It checks its stability across weights and years, its agreement with SAW and VIKOR, its gain over an incident frequency baseline, its behaviour when services are removed and its readability against service profiles. This removal test uses a TOPSIS variant in absolute mode free of rank reversal. Across 20,000 weightings of that variant, the lowest priority service barely moves, while the top varies within a stable cluster of three. The multiple criteria design also surfaces infrastructure lifecycle debt that an incident count misses. The methods agree on the top and bottom of the 2025 ranking. Where they disagree, over the top cluster in the compressed 2024 data, the open question is whether one debt dimension can offset another. To the best of current knowledge, this is the first application of TOPSIS to service management records for debt prioritisation in financial trading IT. It contributes an auditable evaluation logic for regulated environments. The rankings are ordinal signals for decision support rather than measurements of debt. External and longitudinal validation are the main future directions."
  keyword: "technical debt, technical debt prioritisation, TOPSIS, multi-criteria decision-making, MCDM, trading IT, ITSM, CMDB, DORA metrics, composite score"
  chapters:
    - index.qmd
    - references.qmd
  
  appendices: 
    - appendices/appendixa.qmd
    - appendices/appendixb.qmd
    - appendices/appendixc.qmd

